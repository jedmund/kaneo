workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - if: "$CI_COMMIT_TAG"

stages:
  - validate
  - test
  - build

default:
  interruptible: true

.node-job:
  image: node:20.20.2-alpine
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.32.1 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

lint:
  extends: .node-job
  stage: validate
  script:
    # The root Biome config excludes the restored pnpm store from traversal.
    - pnpm exec biome ci .

typecheck:
  extends: .node-job
  stage: validate
  script:
    - pnpm typecheck

# Keep the inherited locale drift visible without blocking this fork's pipelines.
# Remove allow_failure after the upstream locale catalogs pass i18n:check.
i18n:
  extends: .node-job
  stage: validate
  allow_failure: true
  script:
    - pnpm i18n:check

unit:
  extends: .node-job
  stage: test
  script:
    - pnpm test

integration:
  extends: .node-job
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    NODE_ENV: test
    POSTGRES_DB: kaneo_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/kaneo_test
    AUTH_SECRET: test-secret-with-at-least-32-characters
    SCM_SECRET_ENCRYPTION_KEY: ci-only-scm-secret-with-at-least-32-characters
    KANEO_API_URL: http://localhost:1337
    KANEO_CLIENT_URL: http://localhost:5173
    DISABLE_GUEST_ACCESS: "false"
  script:
    - pnpm test:integration

build:
  extends: .node-job
  stage: build
  script:
    - pnpm build

container:
  stage: build
  image: docker:27.5.1-cli
  before_script:
    - |
      buildkit_config="$CI_PROJECT_DIR/.buildkitd.toml"
      if [ -n "${REGISTRY_CA_CERT:-}" ]; then
        registry_ca="$CI_PROJECT_DIR/.registry-ca.crt"
        if [ -f "$REGISTRY_CA_CERT" ]; then
          cp "$REGISTRY_CA_CERT" "$registry_ca"
        else
          printf '%s\n' "$REGISTRY_CA_CERT" > "$registry_ca"
        fi

        # docker login runs in this client container, while buildx pushes from
        # its BuildKit container. Both must trust a private registry CA.
        cp "$registry_ca" /usr/local/share/ca-certificates/kaneo-registry-ca.crt
        update-ca-certificates
        printf '[registry."%s"]\n  ca = ["%s"]\n' \
          "$CI_REGISTRY" "$registry_ca" > "$buildkit_config"
        docker buildx create \
          --name kaneo-ci \
          --driver docker-container \
          --buildkitd-config "$buildkit_config" \
          --use
      else
        docker buildx create \
          --name kaneo-ci \
          --driver docker-container \
          --use
      fi
      docker buildx inspect --bootstrap

      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] || [ -n "$CI_COMMIT_TAG" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login \
          --username "$CI_REGISTRY_USER" \
          --password-stdin \
          "$CI_REGISTRY"
      fi
  script:
    - |
      image="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] || [ -n "$CI_COMMIT_TAG" ]; then
        docker buildx build \
          --provenance=false \
          --file Dockerfile.kaneo \
          --tag "$image" \
          --push \
          .
      else
        docker buildx build \
          --provenance=false \
          --file Dockerfile.kaneo \
          --tag "$image" \
          .
      fi
  after_script:
    - docker buildx rm kaneo-ci || true
    - docker logout "$CI_REGISTRY" || true
